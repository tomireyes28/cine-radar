# nixpacks.toml — Optimized lightweight production build for Railway (~50MB RAM)
# Heavy scraping runs on GitHub Actions (.github/workflows/daily-scraper.yml)

[phases.setup]
nixPkgs = ["..."]

[phases.build]
cmds = ["npm ci", "npx prisma generate", "npm run build"]

[start]
cmd = "npm run start:prod"

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
DISABLE_INTERNAL_CRON = "true"
NODE_ENV = "production"
