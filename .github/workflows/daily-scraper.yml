name: Daily Cinema Billboard Scraper

on:
  schedule:
    # Runs every day at 07:00 UTC (04:00 AM Argentina UTC-3)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      chain:
        description: 'Specific chain key to scrape (leave empty to run all: atlas, multiplex, showcase, cinemark, cinemacenter, cinepolis)'
        required: false
        default: ''
        type: string

jobs:
  scrape-billboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./api

    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
      PUPPETEER_EXECUTABLE_PATH: '/usr/bin/google-chrome-stable'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      DISABLE_INTERNAL_CRON: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './api/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Build
        run: |
          npx prisma generate
          npm run build

      - name: Run Cinema Catalog Seed
        run: npm run db:seed

      - name: Execute Billboard Scrapers
        run: node dist/cli/run-scrapers.js ${{ inputs.chain }}
