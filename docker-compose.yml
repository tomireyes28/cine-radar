version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: cinema_database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: cinema_db
    ports:
      - "5434:5432"
    volumes:
      - cinema_pg_data:/var/lib/postgresql/data

volumes:
  cinema_pg_data: